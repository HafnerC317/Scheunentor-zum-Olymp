<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZUM OLYMP – Fussball Ratings Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zum Olymp">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 50%, #0f0f0f 100%);
            background-attachment: fixed;
            color: #f5f5f5;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        /* Olymp Gold Accent Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212,175,55,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(184,134,11,0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(10,10,10,0.95) 0%, rgba(26,20,16,0.9) 100%);
            border-radius: 20px;
            border: 1px solid rgba(212,175,55,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px rgba(212,175,55,0.1);
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: 800;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212,175,55,0.3);
            letter-spacing: 2px;
        }

        .header .subtitle {
            color: #C0C0C0;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 1em;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: linear-gradient(135deg, rgba(20,20,20,0.85) 0%, rgba(30,25,20,0.8) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(212,175,55,0.2);
        }

        .card h2 {
            color: #D4AF37;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Inputs */
        input, select {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            font-size: 1em;
            background: rgba(0,0,0,0.5);
            color: #f5f5f5;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #666;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
            background: rgba(0,0,0,0.7);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #C0C0C0;
            font-size: 0.95em;
        }

        /* Buttons */
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #000;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212,175,55,0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #C0C0C0;
            border: 1px solid rgba(212,175,55,0.3);
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-secondary:hover {
            background: rgba(212,175,55,0.2);
            color: #D4AF37;
        }

        .btn-delete {
            background: rgba(220,38,38,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(220,38,38,0.3);
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-delete:hover {
            background: rgba(220,38,38,0.3);
        }

        /* Player Cards */
        .player-card {
            background: linear-gradient(135deg, rgba(30,30,30,0.6) 0%, rgba(40,35,30,0.5) 100%);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 16px;
            padding: 18px;
            margin: 12px 0;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .player-card:hover {
            transform: translateX(5px);
            border-color: #D4AF37;
            box-shadow: 0 4px 20px rgba(212,175,55,0.2);
        }

        .player-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(212,175,55,0.3);
            background: rgba(0,0,0,0.4);
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: 700;
            font-size: 1.1em;
            color: #D4AF37;
            margin-bottom: 5px;
        }

        .player-details {
            color: #999;
            font-size: 0.9em;
        }

        .player-rating {
            font-size: 1.8em;
            font-weight: 800;
            min-width: 60px;
            text-align: center;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .player-actions {
            display: flex;
            gap: 8px;
        }

        /* Tier Sections */
        .tier {
            margin: 25px 0;
        }

        .tier-header {
            font-weight: 800;
            font-size: 1.3em;
            margin-bottom: 15px;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid;
        }

        .tier-elite .tier-header {
            background: linear-gradient(135deg, rgba(212,175,55,0.2) 0%, rgba(184,134,11,0.1) 100%);
            border-left-color: #D4AF37;
            color: #FFD700;
        }

        .tier-gold .tier-header {
            background: linear-gradient(135deg, rgba(234,179,8,0.15) 0%, rgba(202,138,4,0.1) 100%);
            border-left-color: #EAB308;
            color: #FBBF24;
        }

        .tier-silver .tier-header {
            background: linear-gradient(135deg, rgba(192,192,192,0.15) 0%, rgba(169,169,169,0.1) 100%);
            border-left-color: #C0C0C0;
            color: #D1D5DB;
        }

        .tier-bronze .tier-header {
            background: linear-gradient(135deg, rgba(205,127,50,0.15) 0%, rgba(184,115,51,0.1) 100%);
            border-left-color: #CD7F32;
            color: #D97706;
        }

        .tier-mentions .tier-header {
            background: linear-gradient(135deg, rgba(100,100,100,0.15) 0%, rgba(80,80,80,0.1) 100%);
            border-left-color: #666;
            color: #999;
        }

        /* Filter Buttons */
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 10px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            color: #999;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #000;
            border-color: #D4AF37;
        }

        /* Dream Squad Styles */
        .formation-select {
            margin-bottom: 25px;
        }

        .pitch {
            background: linear-gradient(135deg, #1a4d2e 0%, #0f2818 100%);
            border-radius: 20px;
            padding: 30px 20px;
            margin: 25px 0;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border: 2px solid rgba(212,175,55,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
        }

        .pitch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255,255,255,0.2);
        }

        .pitch-line {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
            z-index: 1;
        }

        .position-slot {
            background: rgba(0,0,0,0.5);
            border: 2px solid #D4AF37;
            border-radius: 12px;
            padding: 12px;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .position-slot select {
            margin: 8px 0 0 0;
            font-size: 0.85em;
            padding: 8px;
            background: rgba(0,0,0,0.7);
        }

        .position-label {
            font-weight: 700;
            color: #D4AF37;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .selected-player {
            color: #fff;
            font-size: 0.9em;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.6em;
            }
            .player-card {
                flex-direction: column;
                text-align: center;
            }
            .position-slot {
                min-width: 90px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ ZUM OLYMP</h1>
            <p class="subtitle">Premium Spieler-Management</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('ratings')">
                📊 Ratings
            </button>
            <button class="tab-btn" onclick="switchTab('dreamteam')">
                ⚡ Traumaufstellung
            </button>
        </div>

        <!-- Ratings Tab -->
        <div id="ratings-tab" class="tab-content active">
            <div class="card">
                <h2>➕ Spieler hinzufügen</h2>
                <label>Spielername</label>
                <input type="text" id="playerName" placeholder="z.B. Cristiano Ronaldo">
                
                <label>Bild-URL (optional)</label>
                <input type="text" id="playerImage" placeholder="https://... (Link zum Spielerbild)">
                
                <label>Rating (0-99)</label>
                <input type="number" id="playerRating" min="0" max="99" placeholder="z.B. 95">
                
                <label>Position</label>
                <select id="playerPosition">
                    <option value="">Position wählen</option>
                    <option value="TW">TW (Torwart)</option>
                    <option value="LV">LV (Linksverteidiger)</option>
                    <option value="IV">IV (Innenverteidiger)</option>
                    <option value="RV">RV (Rechtsverteidiger)</option>
                    <option value="ZDM">ZDM (Defensives Mittelfeld)</option>
                    <option value="ZM">ZM (Zentrales Mittelfeld)</option>
                    <option value="ZOM">ZOM (Offensives Mittelfeld)</option>
                    <option value="LM">LM (Linkes Mittelfeld)</option>
                    <option value="RM">RM (Rechtes Mittelfeld)</option>
                    <option value="LF">LF (Linksaußen)</option>
                    <option value="RF">RF (Rechtsaußen)</option>
                    <option value="ST">ST (Stürmer)</option>
                </select>
                
                <button class="btn-primary" onclick="addPlayer()">SPIELER HINZUFÜGEN</button>
            </div>

            <div class="card">
                <h2>🏆 Spieler-Rankings</h2>
                
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterPlayers('all')">Alle</button>
                    <button class="filter-btn" onclick="filterPlayers('Torwart')">Torwart</button>
                    <button class="filter-btn" onclick="filterPlayers('Verteidiger')">Verteidiger</button>
                    <button class="filter-btn" onclick="filterPlayers('Mittelfeld')">Mittelfeld</button>
                    <button class="filter-btn" onclick="filterPlayers('Stürmer')">Stürmer</button>
                </div>

                <div id="playerList"></div>
            </div>
        </div>

        <!-- Dream Team Tab -->
        <div id="dreamteam-tab" class="tab-content">
            <div class="card">
                <h2>⚡ Traumaufstellung</h2>
                
                <div class="formation-select">
                    <label>Formation wählen</label>
                    <select id="formationSelect" onchange="updateFormation()">
                        <option value="">-- Formation wählen --</option>
                        <optgroup label="4er Kette">
                            <option value="4-3-3">4-3-3</option>
                            <option value="4-3-3-2">4-3-3 (2)</option>
                            <option value="4-3-3-3">4-3-3 (3)</option>
                            <option value="4-3-3-4">4-3-3 (4)</option>
                            <option value="4-4-2">4-4-2</option>
                            <option value="4-4-2-2">4-4-2 (2)</option>
                            <option value="4-2-3-1">4-2-3-1</option>
                            <option value="4-2-3-1-2">4-2-3-1 (2)</option>
                            <option value="4-1-2-1-2">4-1-2-1-2</option>
                            <option value="4-1-2-1-2-2">4-1-2-1-2 (2)</option>
                            <option value="4-4-1-1">4-4-1-1</option>
                            <option value="4-2-2-2">4-2-2-2</option>
                            <option value="4-3-2-1">4-3-2-1</option>
                            <option value="4-3-1-2">4-3-1-2</option>
                            <option value="4-1-4-1">4-1-4-1</option>
                            <option value="4-5-1">4-5-1</option>
                            <option value="4-5-1-2">4-5-1 (2)</option>
                        </optgroup>
                        <optgroup label="3er Kette">
                            <option value="3-4-3">3-4-3</option>
                            <option value="3-5-2">3-5-2</option>
                            <option value="3-5-2-2">3-5-2 (2)</option>
                            <option value="3-4-2-1">3-4-2-1</option>
                            <option value="3-4-1-2">3-4-1-2</option>
                            <option value="3-1-4-2">3-1-4-2</option>
                            <option value="3-4-3-2">3-4-3 (2)</option>
                        </optgroup>
                        <optgroup label="5er Kette">
                            <option value="5-4-1">5-4-1</option>
                            <option value="5-3-2">5-3-2</option>
                            <option value="5-2-1-2">5-2-1-2</option>
                            <option value="5-2-2-1">5-2-2-1</option>
                            <option value="5-3-2-2">5-3-2 (2)</option>
                        </optgroup>
                        <optgroup label="Spezial">
                            <option value="4-2-4">4-2-4</option>
                            <option value="4-1-3-2">4-1-3-2</option>
                            <option value="3-2-4-1">3-2-4-1</option>
                        </optgroup>
                    </select>
                </div>

                <div id="pitchContainer"></div>
                
                <button class="btn-primary" onclick="saveSquad()" style="margin-top: 20px;">AUFSTELLUNG SPEICHERN</button>
            </div>
        </div>
    </div>

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'ratings') {
                document.getElementById('ratings-tab').classList.add('active');
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            } else {
                document.getElementById('dreamteam-tab').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            }
        }

        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const rating = parseInt(document.getElementById('playerRating').value);
            const image = document.getElementById('playerImage').value.trim();
            const position = document.getElementById('playerPosition').value;

            if(!name || isNaN(rating) || rating < 0 || rating > 99 || !position) {
                alert('Bitte alle Pflichtfelder ausfüllen (Name, Rating 0-99, Position)!');
                return;
            }

            players.push({
                id: Date.now(),
                name,
                rating,
                image: image || 'https://via.placeholder.com/70?text=?',
                position
            });

            saveData();
            document.getElementById('playerName').value = '';
            document.getElementById('playerRating').value = '';
            document.getElementById('playerImage').value = '';
            document.getElementById('playerPosition').value = '';
            displayPlayers();
        }

        function deletePlayer(id) {
            if(confirm('Spieler wirklich löschen?')) {
                players = players.filter(p => p.id !== id);
                saveData();
                displayPlayers();
            }
        }

        function filterPlayers(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayPlayers();
        }

        function getCategoryForPosition(pos) {
            if(pos === 'TW') return 'Torwart';
            if(['LV','IV','RV'].includes(pos)) return 'Verteidiger';
            if(['ZDM','ZM','ZOM','LM','RM'].includes(pos)) return 'Mittelfeld';
            if(['LF','RF','ST'].includes(pos)) return 'Stürmer';
            return 'Sonstige';
        }

        function displayPlayers() {
            let filtered = players;
            if(currentFilter !== 'all') {
                filtered = players.filter(p => getCategoryForPosition(p.position) === currentFilter);
            }

            const tiers = {
                elite: filtered.filter(p => p.rating >= 95 && p.rating <= 99),
                gold: filtered.filter(p => p.rating >= 90 && p.rating < 95),
                silver: filtered.filter(p => p.rating >= 85 && p.rating < 90),
                bronze: filtered.filter(p => p.rating >= 80 && p.rating < 85),
                mentions: filtered.filter(p => p.rating < 80)
            };

            let html = '';
            const tierConfig = [
                {key: 'elite', name: 'Elite-Tier', range: '95-99', class: 'tier-elite'},
                {key: 'gold', name: 'Gold-Tier', range: '90-94', class: 'tier-gold'},
                {key: 'silver', name: 'Silber-Tier', range: '85-89', class: 'tier-silver'},
                {key: 'bronze', name: 'Bronze-Tier', range: '80-84', class: 'tier-bronze'},
                {key: 'mentions', name: 'Ehrenvolle Erwähnungen', range: '0-79', class: 'tier-mentions'}
            ];

            tierConfig.forEach(tier => {
                if(tiers[tier.key].length > 0) {
                    html += `<div class="tier ${tier.class}">
                        <div class="tier-header">
                            ${tier.name} <span style="opacity:0.6; font-size:0.8em; margin-left:auto;">(${tier.range})</span>
                        </div>`;
                    
                    tiers[tier.key].sort((a,b) => b.rating - a.rating).forEach(player => {
                        html += `
                            <div class="player-card">
                                <img src="${player.image}" alt="${player.name}" class="player-img" 
                                     onerror="this.src='https://via.placeholder.com/70?text=?'">
                                <div class="player-info">
                                    <div class="player-name">${player.name}</div>
                                    <div class="player-details">${player.position} • ${getCategoryForPosition(player.position)}</div>
                                </div>
                                <div class="player-rating">${player.rating}</div>
                                <div class="player-actions">
                                    <button class="btn-delete" onclick="deletePlayer(${player.id})">🗑️</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            });

            if(html === '') {
                html = '<p style="text-align:center; color:#666; padding:40px 0;">Noch keine Spieler vorhanden.</p>';
            }

            document.getElementById('playerList').innerHTML = html;
        }

        function updateFormation() {
            const formKey = document.getElementById('formationSelect').value;
            if(!formKey) {
                document.getElementById('pitchContainer').innerHTML = '';
                return;
            }

            const form = formations[formKey];
            let html = '<div class="pitch">';
            
            form.forEach((line, lineIdx) => {
                html += '<div class="pitch-line">';
                line.forEach((slot, slotIdx) => {
                    const slotId = `slot-${lineIdx}-${slotIdx}`;
                    html += `
                        <div class="position-slot">
                            <div class="position-label">${slot.pos}</div>
                            <select id="${slotId}" onchange="updateSlot('${slotId}', '${slot.pos}')">
                                <option value="">-- Wählen --</option>
                                ${getPlayersForPosition(slot.pos)}
                            </select>
                            <div class="selected-player" id="${slotId}-display"></div>
                        </div>
                    `;
                });
                html += '</div>';
            });
            
            html += '</div>';
            document.getElementById('pitchContainer').innerHTML = html;
        }

        function getPlayersForPosition(pos) {
            const eligible = players.filter(p => p.position === pos).sort((a,b) => b.rating - a.rating);
            return eligible.map(p => `<option value="${p.id}">${p.name} (${p.rating})</option>`).join('');
        }

        function updateSlot(slotId, pos) {
            const selectEl = document.getElementById(slotId);
            const playerId = parseInt(selectEl.value);
            const displayEl = document.getElementById(slotId + '-display');
            
            if(playerId) {
                const player = players.find(p => p.id === playerId);
                displayEl.textContent = player ? `${player.name} (${player.rating})` : '';
            } else {
                displayEl.textContent = '';
            }
        }

        function saveSquad() {
            alert('✅ Aufstellung gespeichert! (localStorage)');
        }

        function saveData() {
            localStorage.setItem('players', JSON.stringify(players));
        }

        displayPlayers();
    </script>
