<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Scheunentor zum Olymp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://i.imgur.com/vCwczZs.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <img src="https://i.imgur.com/vCwczZs.png" alt="Logo" class="logo">
    <h1>⚽ Scheunentor zum Olymp</h1>
    <img src="https://i.imgur.com/vCwczZs.png" alt="Ball" class="logo">
    
    <div class="sync-controls">
      <span id="syncStatus">⚠️ Sync inaktiv</span>
      <button id="syncNowBtn" class="btn-sync">🔄 Sync</button>
      <button id="resetTokenBtn" class="btn-sync btn-danger">🗑️ Token</button>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="ratingsTab">📊 Bewertungen</button>
    <button class="tab-btn" data-tab="squadTab">⚽ Traumaufstellung</button>
    <button class="tab-btn" data-tab="olympTab">🏆 Der Olymp</button>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="container">

    <!-- TAB: BEWERTUNGEN -->
    <div id="ratingsTab" class="tab-content active">
      
      <!-- Spieler hinzufügen -->
      <section class="card">
        <h2>➕ Spieler hinzufügen</h2>
        <form id="addPlayerForm" class="player-form">
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="playerName" placeholder="z.B. Lionel Messi" required>
              <div id="nameSuggestions" class="suggestions-list"></div>
            </div>
            
            <div class="form-group">
              <label>Position</label>
              <select id="playerPosition" required>
                <option value="TW">TW - Torwart</option>
                <option value="LV">LV - Linker Verteidiger</option>
                <option value="IV">IV - Innenverteidiger</option>
                <option value="RV">RV - Rechter Verteidiger</option>
                <option value="LM">LM - Linkes Mittelfeld</option>
                <option value="RM">RM - Rechtes Mittelfeld</option>
                <option value="ZDM">ZDM - Zentrales defensives Mittelfeld</option>
                <option value="ZM">ZM - Zentrales Mittelfeld</option>
                <option value="ZOM">ZOM - Zentrales offensives Mittelfeld</option>
                <option value="LF">LF - Linker Flügel</option>
                <option value="RF">RF - Rechter Flügel</option>
                <option value="ST">ST - Stürmer</option>
                <option value="LS">LS - Linker Stürmer</option>
                <option value="RS">RS - Rechter Stürmer</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Rating (0-99)</label>
              <input type="number" id="playerRating" min="0" max="99" placeholder="95" required>
            </div>
          </div>

          <div class="form-group">
            <label>Alternative Positionen</label>
            <div id="altPositionsContainer" class="alt-positions-grid"></div>
          </div>
          
          <div class="form-group">
            <label>Bild-URL (optional)</label>
            <input type="url" id="playerImage" placeholder="https://beispiel.de/bild.jpg">
          </div>
          
          <button type="submit" class="btn btn-primary">💾 Spieler speichern</button>
        </form>
      </section>

      <!-- Spielerliste -->
      <section class="card">
        <h2>📋 Alle Spieler</h2>
        <div id="playersList" class="players-grid"></div>
      </section>

    </div>

    <!-- TAB: TRAUMAUFSTELLUNG -->
    <div id="squadTab" class="tab-content">
      
      <!-- Formation Selector -->
      <section class="card">
        <div class="formation-header">
          <h2>⚽ Aktuelle Formation: <span id="currentFormation">4-3-3</span></h2>
          <button id="formationBtn" class="btn btn-primary">🔧 Formation ändern</button>
        </div>
      </section>

      <!-- Spielfeld -->
      <section class="card">
        <div class="football-field">
          <div id="squadField" class="squad-grid"></div>
        </div>
      </section>

      <!-- Ersatzbank -->
      <section class="card">
        <button id="benchToggle" class="btn btn-secondary">🔼 Bank aufklappen</button>
        <div id="benchSlots" class="bench-grid"></div>
      </section>

      <!-- Aufstellungen speichern/laden -->
      <section class="card">
        <h3>💾 Aufstellungen verwalten</h3>
        <div class="squad-slots">
          <div class="squad-slot-controls">
            <button id="saveSquad1" class="btn btn-save">💾 Slot 1</button>
            <button id="loadSquad1" class="btn btn-load">📂 Laden 1</button>
          </div>
          <div class="squad-slot-controls">
            <button id="saveSquad2" class="btn btn-save">💾 Slot 2</button>
            <button id="loadSquad2" class="btn btn-load">📂 Laden 2</button>
          </div>
          <div class="squad-slot-controls">
            <button id="saveSquad3" class="btn btn-save">💾 Slot 3</button>
            <button id="loadSquad3" class="btn btn-load">📂 Laden 3</button>
          </div>
          <div class="squad-slot-controls">
            <button id="saveSquad4" class="btn btn-save">💾 Slot 4</button>
            <button id="loadSquad4" class="btn btn-load">📂 Laden 4</button>
          </div>
          <div class="squad-slot-controls">
            <button id="saveSquad5" class="btn btn-save">💾 Slot 5</button>
            <button id="loadSquad5" class="btn btn-load">📂 Laden 5</button>
          </div>
        </div>
      </section>

    </div>

    <!-- TAB: DER OLYMP -->
    <div id="olympTab" class="tab-content">
      
      <section class="card">
        <h2>🏆 Die Götter des Fußballs</h2>
        
        <div class="olymp-tabs">
          <button class="olymp-tab-btn active" data-olymp-tab="ranking">🥇 Ranking</button>
          <button class="olymp-tab-btn" data-olymp-tab="positions">📍 Nach Position</button>
        </div>

        <div id="ranking" class="olymp-tab-content active">
          <div id="olympRanking"></div>
        </div>

        <div id="positions" class="olymp-tab-content">
          <div id="olympPositions"></div>
        </div>

      </section>

    </div>

  </main>

  <!-- FORMATION MODAL -->
  <div id="formationModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>🔧 Formation wählen</h2>
      <div id="formationGrid" class="formation-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('✅ Service Worker registriert'))
        .catch(err => console.error('❌ SW-Fehler:', err));
    }

    // Olymp Sub-Tabs
    document.addEventListener('DOMContentLoaded', () => {
      const olympTabs = document.querySelectorAll('.olymp-tab-btn');
      olympTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          olympTabs.forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.olymp-tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.olympTab).classList.add('active');
        });
      });
    });
  </script>

</body>
</html>
