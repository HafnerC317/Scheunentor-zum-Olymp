<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheunentor zum Olymp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://i.imgur.com/vCwczZs.png">
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>
    <div class="container">
        <header>
            <img src="https://i.imgur.com/vCwczZs.png" alt="Logo" class="logo">
            <h1>Scheunentor zum Olymp</h1>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="ratings">Bewertungen</button>
            <button class="tab-btn" data-tab="squad">Traumaufstellung</button>
            <button class="tab-btn" data-tab="olymp">Die Götter des Fußballs</button>
        </nav>

        <!-- TAB: BEWERTUNGEN -->
        <div id="ratings" class="tab-content active">
            <div class="add-player-form">
                <h2>Spieler hinzufügen</h2>
                <input type="text" id="playerName" placeholder="Spielername">
                <input type="number" id="playerRating" placeholder="Rating (0-99)" min="0" max="99">
                <select id="playerPosition">
                    <option value="">Position wählen</option>
                    <option value="TW">TW - Torwart</option>
                    <option value="LV">LV - Linker Verteidiger</option>
                    <option value="IV">IV - Innenverteidiger</option>
                    <option value="RV">RV - Rechter Verteidiger</option>
                    <option value="ZDM">ZDM - Zentrales Defensives Mittelfeld</option>
                    <option value="ZM">ZM - Zentrales Mittelfeld</option>
                    <option value="ZOM">ZOM - Zentrales Offensives Mittelfeld</option>
                    <option value="LM">LM - Linkes Mittelfeld</option>
                    <option value="RM">RM - Rechtes Mittelfeld</option>
                    <option value="LF">LF - Linker Flügel</option>
                    <option value="ST">ST - Sturm</option>
                    <option value="RF">RF - Rechter Flügel</option>
                    <option value="MS">MS - Mittelstürmer</option>
                    <option value="LS">LS - Linksstürmer</option>
                    <option value="RS">RS - Rechtsstürmer</option>
                </select>
                <input type="url" id="playerImage" placeholder="Bild-URL (optional)">
                <button id="addPlayerBtn">Spieler hinzufügen</button>
            </div>

            <div class="filter-section">
                <input type="text" id="searchPlayer" placeholder="🔍 Spieler suchen...">
                <select id="filterTier">
                    <option value="">Alle Tiers</option>
                    <option value="Elite">Elite (95-99)</option>
                    <option value="Gold">Gold (90-94)</option>
                    <option value="Silber">Silber (85-89)</option>
                    <option value="Bronze">Bronze (80-84)</option>
                    <option value="Champions League">Champions League (0-79)</option>
                </select>
                <select id="filterPosition">
                    <option value="">Alle Positionen</option>
                    <option value="TW">TW</option>
                    <option value="LV">LV</option>
                    <option value="IV">IV</option>
                    <option value="RV">RV</option>
                    <option value="ZDM">ZDM</option>
                    <option value="ZM">ZM</option>
                    <option value="ZOM">ZOM</option>
                    <option value="LM">LM</option>
                    <option value="RM">RM</option>
                    <option value="LF">LF</option>
                    <option value="ST">ST</option>
                    <option value="RF">RF</option>
                    <option value="MS">MS</option>
                    <option value="LS">LS</option>
                    <option value="RS">RS</option>
                </select>
            </div>

            <div id="playerList" class="player-list"></div>
        </div>

        <!-- TAB: TRAUMAUFSTELLUNG -->
        <div id="squad" class="tab-content">
            <div class="squad-controls">
                <h2>Traumaufstellung</h2>
                <select id="formationSelect">
                    <option value="4-3-3">4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="4-2-3-1">4-2-3-1</option>
                    <option value="3-5-2">3-5-2</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="5-3-2">5-3-2</option>
                    <option value="4-1-2-1-2">4-1-2-1-2</option>
                    <option value="4-3-2-1">4-3-2-1</option>
                    <option value="4-3-1-2">4-3-1-2</option>
                    <option value="4-5-1">4-5-1</option>
                    <option value="3-4-2-1">3-4-2-1</option>
                    <option value="5-4-1">5-4-1</option>
                    <option value="4-1-4-1">4-1-4-1</option>
                    <option value="4-4-1-1">4-4-1-1</option>
                    <option value="3-5-1-1">3-5-1-1</option>
                    <option value="3-1-4-2">3-1-4-2</option>
                    <option value="5-2-3">5-2-3</option>
                    <option value="4-2-2-2">4-2-2-2</option>
                    <option value="3-4-1-2">3-4-1-2</option>
                    <option value="5-2-1-2">5-2-1-2</option>
                    <option value="4-3-3-Attack">4-3-3 Attack</option>
                    <option value="4-3-3-Defend">4-3-3 Defend</option>
                    <option value="4-2-3-1-Wide">4-2-3-1 Wide</option>
                    <option value="4-1-2-1-2-Wide">4-1-2-1-2 Wide</option>
                    <option value="3-4-3-Flat">3-4-3 Flat</option>
                    <option value="5-3-2-Flat">5-3-2 Flat</option>
                </select>
                <button id="saveSquadBtn">Aufstellung speichern</button>
                <button id="loadSquadBtn">Aufstellung laden</button>
            </div>

            <div id="squadField" class="squad-field"></div>

            <div class="bench-container">
                <button id="toggleBench" class="toggle-bench-btn">Ersatzbank aufklappen ▼</button>
                <div id="benchSlots" class="bench-slots" style="display: none;">
                    <!-- 7 Ersatzbank-Slots -->
                </div>
            </div>
        </div>

        <!-- TAB: DIE GÖTTER DES FUßBALLS -->
        <div id="olymp" class="tab-content">
            <h2>Die Götter des Fußballs</h2>
            <nav class="olymp-tabs">
                <button class="olymp-tab-btn active" data-olymp="ranking">Ranking</button>
                <button class="olymp-tab-btn" data-olymp="position">Nach Position</button>
            </nav>

            <div id="ranking" class="olymp-content active">
                <div id="rankingList"></div>
            </div>

            <div id="position" class="olymp-content">
                <div id="positionList"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: SPIELER AUSWÄHLEN -->
    <div id="playerSelectModal" class="modal">
        <div class="modal-content">
            <h3>Spieler auswählen</h3>
            <input type="text" id="modalSearchPlayer" placeholder="🔍 Suchen...">
            <div id="modalPlayerList" class="modal-player-list"></div>
            <button id="closeModalBtn" class="close-modal-btn">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: ALTERNATIVE POSITIONEN -->
    <div id="altPositionModal" class="modal">
        <div class="modal-content">
            <h3>Alternative Positionen</h3>
            <div id="altPositionCheckboxes" class="alt-position-grid"></div>
            <button id="saveAltPositionsBtn">Speichern</button>
            <button id="closeAltModalBtn" class="close-modal-btn">Abbrechen</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('✅ Service Worker registriert:', reg))
                .catch(err => console.error('❌ Service Worker Fehler:', err));
        }
    </script>
</body>
</html>
