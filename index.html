<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheunentor zum Olymp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            border: 3px solid rgba(212, 175, 55, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #D4AF37;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        .tab.active {
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            color: #0a0a0a;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #D4AF37;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            border: none;
            border-radius: 10px;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: rgba(212, 175, 55, 0.2);
            color: #D4AF37;
            border: 2px solid #D4AF37;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.3);
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid;
            position: relative;
            transition: all 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .player-card.elite { border-color: #8B5CF6; }
        .player-card.gold { border-color: #D4AF37; }
        .player-card.silver { border-color: #C0C0C0; }
        .player-card.bronze { border-color: #CD7F32; }
        .player-card.champions { border-color: #003B7A; }

        .player-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #D4AF37;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-position {
            background: rgba(212, 175, 55, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .player-rating {
            font-size: 2rem;
            font-weight: bold;
        }

        .tier-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .tier-badge.elite { background: #8B5CF6; }
        .tier-badge.gold { background: #D4AF37; color: #0a0a0a; }
        .tier-badge.silver { background: #C0C0C0; color: #0a0a0a; }
        .tier-badge.bronze { background: #CD7F32; }
        .tier-badge.champions { background: #003B7A; }

        .delete-btn {
            width: 100%;
            padding: 10px;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            color: #ff6b6b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(220, 38, 38, 0.4);
        }

        /* Traumaufstellung Styles */
        .formation-selector {
            margin-bottom: 30px;
        }

        .pitch {
            background: linear-gradient(to bottom, 
                #1a5f1a 0%, 
                #2d8b2d 50%, 
                #1a5f1a 100%);
            border-radius: 15px;
            padding: 30px 20px;
            position: relative;
            min-height: 600px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .pitch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
        }

        .pitch-line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
        }

        .formation-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            position: relative;
        }

        .player-slot {
            width: 80px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .player-slot:hover {
            transform: scale(1.1);
        }

        .player-slot-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.3);
            border: 3px solid #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-weight: bold;
            font-size: 0.9rem;
            overflow: hidden;
        }

        .player-slot-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-slot-name {
            font-size: 0.75rem;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }

        .player-slot-rating {
            font-size: 0.9rem;
            color: #D4AF37;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .player-slot.filled .player-slot-circle {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .squad-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .squad-modal-content {
            background: linear-gradient(135deg, #1a1410 0%, #0a0a0a 100%);
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #D4AF37;
        }

        .squad-modal h3 {
            color: #D4AF37;
            margin-bottom: 20px;
        }

        .squad-player-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .squad-player-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .squad-player-item:hover {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
        }

        .squad-player-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.05);
        }

        .close-modal {
            background: rgba(220, 38, 38, 0.2);
            border: 2px solid #dc2626;
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Ersatzbank Styles */
        .bench-container {
            margin-top: 20px;
        }

        .bench-toggle {
            width: 100%;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #D4AF37;
            border-radius: 10px;
            color: #D4AF37;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .bench-toggle:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .bench-slots {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .bench-slots.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
        }

        /* Hall of Fame Styles */
        .hall-of-fame {
            margin-top: 40px;
        }

        .hall-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hall-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hall-filter-btn {
            padding: 10px 20px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #D4AF37;
            border-radius: 8px;
            color: #D4AF37;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .hall-filter-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .hall-filter-btn.active {
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
            color: #0a0a0a;
        }

        .hall-tier-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 2px solid;
        }

        .hall-tier-section.elite { border-color: #8B5CF6; }
        .hall-tier-section.gold { border-color: #D4AF37; }
        .hall-tier-section.silver { border-color: #C0C0C0; }
        .hall-tier-section.bronze { border-color: #CD7F32; }
        .hall-tier-section.champions { border-color: #003B7A; }

        .hall-tier-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hall-tier-title.elite { color: #8B5CF6; }
        .hall-tier-title.gold { color: #D4AF37; }
        .hall-tier-title.silver { color: #C0C0C0; }
        .hall-tier-title.bronze { color: #CD7F32; }
        .hall-tier-title.champions { color: #003B7A; }

        /* KOMPAKTERE HALL OF FAME SPIELER-KARTEN */
        .hall-player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .hall-player-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            border: 2px solid;
            transition: all 0.3s ease;
        }

        .hall-player-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .hall-player-card.elite { border-color: #8B5CF6; }
        .hall-player-card.gold { border-color: #D4AF37; }
        .hall-player-card.silver { border-color: #C0C0C0; }
        .hall-player-card.bronze { border-color: #CD7F32; }
        .hall-player-card.champions { border-color: #003B7A; }

        .hall-player-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .hall-player-name {
            font-size: 1rem;
            font-weight: bold;
            color: #D4AF37;
            margin-bottom: 8px;
            text-align: center;
        }

        .hall-player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .hall-player-position {
            background: rgba(212, 175, 55, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
        }

        .hall-player-rating {
            font-size: 1.3rem;
            font-weight: bold;
            color: #D4AF37;
        }

        @media (max-width: 768px) {
            .logo {
                width: 80px;
                height: 80px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .player-grid {
                grid-template-columns: 1fr;
            }

            .pitch {
                padding: 20px 10px;
                min-height: 500px;
            }

            .player-slot {
                width: 60px;
            }

            .player-slot-circle {
                width: 45px;
                height: 45px;
                font-size: 0.75rem;
            }

            .player-slot-name {
                font-size: 0.65rem;
            }

            .formation-row {
                margin-bottom: 30px;
            }

            .bench-slots.active {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            }

            .hall-player-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }

            .hall-player-image {
                height: 100px;
            }

            .hall-player-name {
                font-size: 0.9rem;
            }

            .hall-tier-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.imgur.com/vCwczZs.png" alt="Scheunentor zum Olymp Logo" class="logo" onerror="this.style.display='none'">
        <h1>⚽ Scheunentor zum Olymp ⚽</h1>
        <p class="subtitle">Deine persönliche Fußball-Bewertungsplattform</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('ratings')">⭐ Bewertungen</div>
            <div class="tab" onclick="switchTab('squad')">🏆 Traumaufstellung</div>
        </div>

        <!-- Bewertungen Tab -->
        <div id="ratings" class="tab-content active">
            <div class="glass-card">
                <h2 style="margin-bottom: 20px; color: #D4AF37;">➕ Neuen Spieler hinzufügen</h2>
                
                <div class="input-group">
                    <label>Spielername</label>
                    <input type="text" id="playerName" placeholder="z.B. Cristiano Ronaldo">
                </div>

                <div class="input-group">
                    <label>Bild-URL</label>
                    <input type="url" id="playerImage" placeholder="https://...">
                </div>

                <div class="input-group">
                    <label>Position</label>
                    <select id="playerPosition">
                        <option value="TW">TW - Torwart</option>
                        <option value="IV">IV - Innenverteidiger</option>
                        <option value="LV">LV - Linksverteidiger</option>
                        <option value="RV">RV - Rechtsverteidiger</option>
                        <option value="LWB">LWB - Linker Wingback</option>
                        <option value="RWB">RWB - Rechter Wingback</option>
                        <option value="ZDM">ZDM - Zentrales defensives Mittelfeld</option>
                        <option value="ZM">ZM - Zentrales Mittelfeld</option>
                        <option value="ZOM">ZOM - Zentrales offensives Mittelfeld</option>
                        <option value="LM">LM - Linkes Mittelfeld</option>
                        <option value="RM">RM - Rechtes Mittelfeld</option>
                        <option value="LF">LF - Linksaußen</option>
                        <option value="RF">RF - Rechtsaußen</option>
                        <option value="MS">MS - Mittelstürmer</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Rating (0-99)</label>
                    <input type="number" id="playerRating" min="0" max="99" placeholder="z.B. 95">
                </div>

                <button class="btn" onclick="addPlayer()">✨ Spieler hinzufügen</button>
            </div>

            <div class="player-grid" id="playerList"></div>
        </div>

        <!-- Traumaufstellung Tab -->
        <div id="squad" class="tab-content">
            <div class="glass-card formation-selector">
                <h2 style="margin-bottom: 20px; color: #D4AF37;">⚙️ Formation wählen</h2>
                <select id="formationSelect" onchange="changeFormation()" style="margin-bottom: 15px;">
                    <optgroup label="Defensiv">
                        <option value="5-4-1">5-4-1</option>
                        <option value="5-3-2">5-3-2</option>
                        <option value="5-2-1-2">5-2-1-2</option>
                    </optgroup>
                    <optgroup label="Ausgewogen">
                        <option value="4-4-2" selected>4-4-2</option>
                        <option value="4-3-3">4-3-3</option>
                        <option value="4-3-3 (2)">4-3-3 (Defensive)</option>
                        <option value="4-3-3 (3)">4-3-3 (Angriff)</option>
                        <option value="4-3-3 (4)">4-3-3 (Falsche 9)</option>
                        <option value="4-2-3-1">4-2-3-1</option>
                        <option value="4-2-3-1 (2)">4-2-3-1 (Breit)</option>
                        <option value="4-5-1">4-5-1</option>
                        <option value="4-4-1-1">4-4-1-1</option>
                        <option value="4-1-4-1">4-1-4-1</option>
                        <option value="4-3-1-2">4-3-1-2</option>
                        <option value="4-1-2-1-2">4-1-2-1-2</option>
                        <option value="4-1-2-1-2 (2)">4-1-2-1-2 (Schmal)</option>
                    </optgroup>
                    <optgroup label="Offensiv">
                        <option value="3-5-2">3-5-2</option>
                        <option value="3-4-3">3-4-3</option>
                        <option value="3-4-2-1">3-4-2-1</option>
                        <option value="3-1-4-2">3-1-4-2</option>
                        <option value="3-4-1-2">3-4-1-2</option>
                    </optgroup>
                </select>
                <button class="btn btn-secondary" onclick="clearSquad()">🔄 Aufstellung zurücksetzen</button>
            </div>

            <div class="pitch" id="pitch">
                <div class="pitch-line"></div>
            </div>

            <div class="bench-container">
                <button class="bench-toggle" onclick="toggleBench()">
                    <span id="benchToggleText">⬆️ Ersatzbank aufklappen</span>
                </button>
                <div class="bench-slots" id="benchSlots"></div>
            </div>
        </div>

        <!-- Hall of Fame -->
        <div class="hall-of-fame">
            <h2 class="hall-title">🏛️ Die Götter des Fußballs 🏛️</h2>
            
            <div class="hall-filters">
                <button class="hall-filter-btn active" onclick="filterHall('all')">Alle</button>
                <button class="hall-filter-btn" onclick="filterHall('goalkeeper')">Torwart</button>
                <button class="hall-filter-btn" onclick="filterHall('defender')">Verteidiger</button>
                <button class="hall-filter-btn" onclick="filterHall('midfielder')">Mittelfeld</button>
                <button class="hall-filter-btn" onclick="filterHall('forward')">Stürmer</button>
            </div>

            <div id="hallOfFame"></div>
        </div>
    </div>

    <!-- Squad Player Selection Modal -->
    <div id="squadModal" class="squad-modal">
        <div class="squad-modal-content">
            <h3>Spieler für Position <span id="modalPosition"></span> auswählen</h3>
            <div class="squad-player-list" id="squadPlayerList"></div>
            <button class="close-modal" onclick="closeSquadModal()">Schließen</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('players')) || [];
        let currentSquad = JSON.parse(localStorage.getItem('currentSquad')) || {};
        let currentBench = JSON.parse(localStorage.getItem('currentBench')) || {};
        let currentFormation = localStorage.getItem('currentFormation') || '4-4-2';
        let selectedPosition = null;
        let currentHallFilter = 'all';

        const formations = {
            '5-4-1': [
                ['MS'],
                ['LM', 'ZM', 'ZM', 'RM'],
                ['LWB', 'IV', 'IV', 'IV', 'RWB'],
                ['TW']
            ],
            '5-3-2': [
                ['MS', 'MS'],
                ['LM', 'ZM', 'RM'],
                ['LWB', 'IV', 'IV', 'IV', 'RWB'],
                ['TW']
            ],
            '5-2-1-2': [
                ['MS', 'MS'],
                ['ZOM'],
                ['ZM', 'ZM'],
                ['LWB', 'IV', 'IV', 'IV', 'RWB'],
                ['TW']
            ],
            '4-4-2': [
                ['MS', 'MS'],
                ['LM', 'ZM', 'ZM', 'RM'],
                ['LV', 'IV', 'IV', 'RV'],
                ['TW']
            ],
            '4-3-3': [
                ['MS'],
                ['LF', 'ZOM', 'RF'],

        function getTier(rating) {
            if (rating >= 95) return { name: 'Elite', class: 'elite', range: '95-99' };
            if (rating >= 90) return { name: 'Gold', class: 'gold', range: '90-94' };
            if (rating >= 85) return { name: 'Silber', class: 'silver', range: '85-89' };
            if (rating >= 80) return { name: 'Bronze', class: 'bronze', range: '80-84' };
            return { name: 'Champions League', class: 'champions', range: '0-79' };
        }

        function getPositionCategory(position) {
            if (position === 'TW') return 'goalkeeper';
            if (['IV', 'LV', 'RV', 'LWB', 'RWB'].includes(position)) return 'defender';
            if (['ZDM', 'ZM', 'ZOM', 'LM', 'RM'].includes(position)) return 'midfielder';
            if (['LF', 'RF', 'MS'].includes(position)) return 'forward';
            return 'other';
        }

        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const image = document.getElementById('playerImage').value.trim();
            const position = document.getElementById('playerPosition').value;
            const rating = parseInt(document.getElementById('playerRating').value);

            if (!name || !position || isNaN(rating) || rating < 0 || rating > 99) {
                alert('Bitte fülle alle Felder korrekt aus!');
                return;
            }

            const player = {
                id: Date.now(),
                name,
                image: image || 'https://via.placeholder.com/200x200?text=Kein+Bild',
                position,
                rating,
                tier: getTier(rating)
            };

            players.push(player);
            localStorage.setItem('players', JSON.stringify(players));

            document.getElementById('playerName').value = '';
            document.getElementById('playerImage').value = '';
            document.getElementById('playerRating').value = '';

            renderPlayers();
            renderHallOfFame();
        }

        function deletePlayer(id) {
            if (confirm('Spieler wirklich löschen?')) {
                players = players.filter(p => p.id !== id);
                
                // Remove from squad and bench
                for (let key in currentSquad) {
                    if (currentSquad[key] === id) delete currentSquad[key];
                }
                for (let key in currentBench) {
                    if (currentBench[key] === id) delete currentBench[key];
                }

                localStorage.setItem('players', JSON.stringify(players));
                localStorage.setItem('currentSquad', JSON.stringify(currentSquad));
                localStorage.setItem('currentBench', JSON.stringify(currentBench));

                renderPlayers();
                renderFormation();
                renderBench();
                renderHallOfFame();
            }
        }

        function renderPlayers() {
            const container = document.getElementById('playerList');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">Noch keine Spieler hinzugefügt. Füge deinen ersten Spieler hinzu! ⚽</p>';
                return;
            }

            players.forEach(player => {
                const card = document.createElement('div');
                card.className = `player-card ${player.tier.class}`;
                card.innerHTML = `
                    <div class="tier-badge ${player.tier.class}">${player.tier.name}</div>
                    <img src="${player.image}" alt="${player.name}" class="player-image" onerror="this.src='https://via.placeholder.com/200x200?text=Kein+Bild'">
                    <div class="player-name">${player.name}</div>
                    <div class="player-info">
                        <span class="player-position">${player.position}</span>
                        <span class="player-rating">${player.rating}</span>
                    </div>
                    <button class="delete-btn" onclick="deletePlayer(${player.id})">🗑️ Löschen</button>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');

            if (tab === 'squad') {
                renderFormation();
                renderBench();
            }
        }

        function changeFormation() {
            currentFormation = document.getElementById('formationSelect').value;
            localStorage.setItem('currentFormation', currentFormation);
            renderFormation();
        }

        function renderFormation() {
            const pitch = document.getElementById('pitch');
            const formation = formations[currentFormation];
            
            pitch.innerHTML = '<div class="pitch-line"></div>';

            formation.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'formation-row';
                
                row.forEach((position, posIndex) => {
                    const slotId = `${rowIndex}-${posIndex}`;
                    const playerId = currentSquad[slotId];
                    const player = players.find(p => p.id === playerId);

                    const slot = document.createElement('div');
                    slot.className = `player-slot ${player ? 'filled' : ''}`;
                    slot.onclick = () => openSquadModal(slotId, position);

                    if (player) {
                        slot.innerHTML = `
                            <div class="player-slot-circle">
                                <img src="${player.image}" alt="${player.name}" onerror="this.src='https://via.placeholder.com/60x60?text=${position}'">
                            </div>
                            <div class="player-slot-name">${player.name}</div>
                            <div class="player-slot-rating">${player.rating}</div>
                        `;
                    } else {
                        slot.innerHTML = `
                            <div class="player-slot-circle">${position}</div>
                            <div class="player-slot-name">Leer</div>
                        `;
                    }

                    rowDiv.appendChild(slot);
                });

                pitch.appendChild(rowDiv);
            });
        }

        function renderBench() {
            const benchSlots = document.getElementById('benchSlots');
            benchSlots.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const playerId = currentBench[`bench-${i}`];
                const player = players.find(p => p.id === playerId);

                const slot = document.createElement('div');
                slot.className = `player-slot ${player ? 'filled' : ''}`;
                slot.onclick = () => openBenchModal(i);

                if (player) {
                    slot.innerHTML = `
                        <div class="player-slot-circle">
                            <img src="${player.image}" alt="${player.name}" onerror="this.src='https://via.placeholder.com/60x60?text=SUB'">
                        </div>
                        <div class="player-slot-name">${player.name}</div>
                        <div class="player-slot-rating">${player.rating}</div>
                    `;
                } else {
                    slot.innerHTML = `
                        <div class="player-slot-circle">SUB</div>
                        <div class="player-slot-name">Leer</div>
                    `;
                }

                benchSlots.appendChild(slot);
            }
        }

        function toggleBench() {
            const benchSlots = document.getElementById('benchSlots');
            const toggleText = document.getElementById('benchToggleText');
            
            benchSlots.classList.toggle('active');
            
            if (benchSlots.classList.contains('active')) {
                toggleText.textContent = '⬇️ Ersatzbank zuklappen';
            } else {
                toggleText.textContent = '⬆️ Ersatzbank aufklappen';
            }
        }

        function openSquadModal(slotId, position) {
            selectedPosition = slotId;
            document.getElementById('modalPosition').textContent = position;
            
            const modal = document.getElementById('squadModal');
            const playerList = document.getElementById('squadPlayerList');
            
            playerList.innerHTML = '';

            // Add "Remove Player" option
            const removeOption = document.createElement('div');
            removeOption.className = 'squad-player-item';
            removeOption.innerHTML = '<strong style="color: #ff6b6b;">❌ Spieler entfernen</strong>';
            removeOption.onclick = () => {
                delete currentSquad[slotId];
                localStorage.setItem('currentSquad', JSON.stringify(currentSquad));
                renderFormation();
                closeSquadModal();
            };
            playerList.appendChild(removeOption);

            // Filter available players
            const usedPlayerIds = Object.values(currentSquad);
            const availablePlayers = players.filter(p => !usedPlayerIds.includes(p.id));

            availablePlayers.forEach(player => {
                const item = document.createElement('div');
                item.className = 'squad-player-item';
                item.innerHTML = `
                    <img src="${player.image}" alt="${player.name}" class="squad-player-img" onerror="this.src='https://via.placeholder.com/50x50?text=${player.position}'">
                    <div>
                        <strong>${player.name}</strong> (${player.position}) - ${player.rating}
                    </div>
                `;
                item.onclick = () => {
                    currentSquad[slotId] = player.id;
                    localStorage.setItem('currentSquad', JSON.stringify(currentSquad));
                    renderFormation();
                    closeSquadModal();
                };
                playerList.appendChild(item);
            });

            modal.style.display = 'block';
        }

        function openBenchModal(benchIndex) {
            const slotId = `bench-${benchIndex}`;
            selectedPosition = slotId;
            
            const modal = document.getElementById('squadModal');
            const playerList = document.getElementById('squadPlayerList');
            
            document.getElementById('modalPosition').textContent = `Ersatzbank Platz ${benchIndex + 1}`;
            playerList.innerHTML = '';

            // Add "Remove Player" option
            const removeOption = document.createElement('div');
            removeOption.className = 'squad-player-item';
            removeOption.innerHTML = '<strong style="color: #ff6b6b;">❌ Spieler entfernen</strong>';
            removeOption.onclick = () => {
                delete currentBench[slotId];
                localStorage.setItem('currentBench', JSON.stringify(currentBench));
                renderBench();
                closeSquadModal();
            };
            playerList.appendChild(removeOption);

            // Filter available players
            const usedPlayerIds = [...Object.values(currentSquad), ...Object.values(currentBench)];
            const availablePlayers = players.filter(p => !usedPlayerIds.includes(p.id));

            availablePlayers.forEach(player => {
                const item = document.createElement('div');
                item.className = 'squad-player-item';
                item.innerHTML = `
                    <img src="${player.image}" alt="${player.name}" class="squad-player-img" onerror="this.src='https://via.placeholder.com/50x50?text=${player.position}'">
                    <div>
                        <strong>${player.name}</strong> (${player.position}) - ${player.rating}
                    </div>
                `;
                item.onclick = () => {
                    currentBench[slotId] = player.id;
                    localStorage.setItem('currentBench', JSON.stringify(currentBench));
                    renderBench();
                    closeSquadModal();
                };
                playerList.appendChild(item);
            });

            modal.style.display = 'block';
        }

        function closeSquadModal() {
            document.getElementById('squadModal').style.display = 'none';
        }

        function clearSquad() {
            if (confirm('Aufstellung wirklich zurücksetzen?')) {
                currentSquad = {};
                currentBench = {};
                localStorage.setItem('currentSquad', JSON.stringify(currentSquad));
                localStorage.setItem('currentBench', JSON.stringify(currentBench));
                renderFormation();
                renderBench();
            }
        }

        function filterHall(category) {
            currentHallFilter = category;
            
            document.querySelectorAll('.hall-filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderHallOfFame();
        }

        function renderHallOfFame() {
            const container = document.getElementById('hallOfFame');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">Noch keine Legenden vorhanden...</p>';
                return;
            }

            // Filter players by category
            let filteredPlayers = players;
            if (currentHallFilter !== 'all') {
                filteredPlayers = players.filter(p => getPositionCategory(p.position) === currentHallFilter);
            }

            // Group by tier
            const tiers = ['elite', 'gold', 'silver', 'bronze', 'champions'];
            const tierNames = {
                elite: 'Elite',
                gold: 'Gold',
                silver: 'Silber',
                bronze: 'Bronze',
                champions: 'Champions League'
            };
            const tierRanges = {
                elite: '95-99',
                gold: '90-94',
                silver: '85-89',
                bronze: '80-84',
                champions: '0-79'
            };

            tiers.forEach(tier => {
                const tierPlayers = filteredPlayers
                    .filter(p => p.tier.class === tier)
                    .sort((a, b) => b.rating - a.rating);

                if (tierPlayers.length > 0) {
                    const section = document.createElement('div');
                    section.className = `hall-tier-section ${tier}`;
                    
                    const title = document.createElement('div');
                    title.className = `hall-tier-title ${tier}`;
                    title.innerHTML = `
                        <span>${tierNames[tier]}</span>
                        <span>${tierRanges[tier]} • ${tierPlayers.length} Spieler</span>
                    `;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'hall-player-grid';

                    tierPlayers.forEach(player => {
                        const card = document.createElement('div');
                        card.className = `hall-player-card ${tier}`;
                        card.innerHTML = `
                            <img src="${player.image}" alt="${player.name}" class="hall-player-image" onerror="this.src='https://via.placeholder.com/180x120?text=Kein+Bild'">
                            <div class="hall-player-name">${player.name}</div>
                            <div class="hall-player-info">
                                <span class="hall-player-position">${player.position}</span>
                                <span class="hall-player-rating">${player.rating}</span>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                }
            });
        }

        // Initialize
        document.getElementById('formationSelect').value = currentFormation;
        renderPlayers();
        renderFormation();
        renderBench();
        renderHallOfFame();

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('squadModal');
            if (event.target === modal) {
                closeSquadModal();
            }
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
