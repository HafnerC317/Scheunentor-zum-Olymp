<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheunentor zum Olymp</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 3em;
      color: #D4AF37;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .header h1::before,
    .header h1::after {
      content: "⚽";
      font-size: 0.8em;
    }
    .subtitle {
      color: #aaa;
      font-size: 1.2em;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      min-width: 200px;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      color: #D4AF37;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .tab-btn:hover {
      background: rgba(212, 175, 55, 0.1);
      transform: translateY(-2px);
    }
    .tab-btn.active {
      background: #D4AF37;
      color: #0a0a0a;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #D4AF37;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1em;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #D4AF37;
    }
    .btn {
      padding: 12px 30px;
      background: #D4AF37;
      border: none;
      border-radius: 8px;
      color: #0a0a0a;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1em;
    }
    .btn:hover {
      background: #b8941f;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #D4AF37;
      border: 2px solid rgba(212, 175, 55, 0.3);
    }
    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.2);
    }
    .btn-danger {
      background: rgba(220, 53, 69, 0.8);
      color: #fff;
    }
    .btn-danger:hover {
      background: rgba(220, 53, 69, 1);
    }
    .tier-section {
      margin-bottom: 40px;
    }
    .tier-header {
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
    }
    .tier-elite { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
    .tier-gold { background: linear-gradient(135deg, #D4AF37, #b8941f); }
    .tier-silver { background: linear-gradient(135deg, #C0C0C0, #999); }
    .tier-bronze { background: linear-gradient(135deg, #CD7F32, #A0522D); }
    .tier-cl { background: linear-gradient(135deg, #003B7A, #002752); }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .player-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .player-card:hover {
      transform: translateY(-5px);
      border-color: #D4AF37;
    }
    .player-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .player-name {
      font-size: 1.3em;
      color: #D4AF37;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .player-rating {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .player-positions {
      margin-bottom: 10px;
    }
    .position-tag {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 4px;
      margin: 2px;
      font-size: 0.85em;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
    .position-tag.primary {
      background: rgba(212, 175, 55, 0.4);
      font-weight: bold;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .action-buttons button {
      flex: 1;
      padding: 8px;
      font-size: 0.9em;
    }
    .hof-header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 20px;
      margin-bottom: 30px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .hof-title {
      font-size: 2.5em;
      color: #D4AF37;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .hof-title::before,
    .hof-title::after {
      content: "🏆";
      font-size: 0.8em;
    }
    .hof-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .hof-tab-btn {
      padding: 12px 24px;
      background: rgba(26, 20, 16, 0.8);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      color: #D4AF37;
      cursor: pointer;
      transition: all 0.3s;
    }
    .hof-tab-btn:hover {
      background: rgba(212, 175, 55, 0.2);
    }
    .hof-tab-btn.active {
      background: #D4AF37;
      color: #0a0a0a;
      font-weight: bold;
    }
    .formation-selector {
      margin-bottom: 30px;
    }
    .formation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .formation-btn {
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      color: #D4AF37;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.1em;
      font-weight: bold;
    }
    .formation-btn:hover {
      background: rgba(212, 175, 55, 0.1);
    }
    .formation-btn.active {
      background: #D4AF37;
      color: #0a0a0a;
    }
    .pitch {
      background: linear-gradient(to bottom, #0a5c0a 0%, #0d7d0d 100%);
      border-radius: 20px;
      padding: 30px;
      margin: 30px 0;
      border: 3px solid #fff;
      position: relative;
      min-height: 600px;
    }
    .pitch::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
    }
    .pitch-row {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      position: relative;
      z-index: 1;
    }
    .pitch-slot {
      width: 100px;
      height: 120px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed rgba(212, 175, 55, 0.5);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .pitch-slot:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: #D4AF37;
    }
    .pitch-slot.filled {
      background: rgba(212, 175, 55, 0.3);
      border: 2px solid #D4AF37;
    }
    .pitch-slot img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 5px;
    }
    .pitch-slot .player-name-small {
      font-size: 0.75em;
      text-align: center;
      color: #fff;
      font-weight: bold;
    }
    .pitch-slot .player-rating-small {
      font-size: 1em;
      color: #D4AF37;
      font-weight: bold;
    }
    .bench-container {
      margin-top: 30px;
    }
    .bench-toggle {
      width: 100%;
      padding: 15px;
      background: rgba(212, 175, 55, 0.2);
      border: 2px solid #D4AF37;
      border-radius: 12px;
      color: #D4AF37;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .bench-toggle:hover {
      background: rgba(212, 175, 55, 0.3);
    }
    .bench-slots {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }
    .bench-slots.open {
      display: grid;
    }
    .squad-management {
      margin: 30px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 2px solid rgba(212, 175, 55, 0.3);
    }
    .squad-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .squad-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .squad-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
    }
    .squad-item-name {
      font-weight: bold;
      color: #D4AF37;
    }
    .squad-item-buttons {
      display: flex;
      gap: 5px;
    }
    .squad-item-buttons button {
      padding: 5px 10px;
      font-size: 0.85em;
    }
    .alt-positions-container {
      margin-top: 15px;
    }
    .alt-positions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .alt-pos-checkbox {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .alt-pos-checkbox:hover {
      background: rgba(212, 175, 55, 0.1);
    }
    .alt-pos-checkbox input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .alt-pos-checkbox label {
      margin: 0;
      cursor: pointer;
      color: #fff;
      font-size: 0.9em;
    }
    .reset-container {
      margin-top: 40px;
      padding: 20px;
      background: rgba(220, 53, 69, 0.1);
      border: 2px solid rgba(220, 53, 69, 0.3);
      border-radius: 12px;
    }
    .reset-warning {
      color: #ff6b6b;
      margin-bottom: 15px;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      .header h1 { font-size: 2em; }
      .players-grid { grid-template-columns: 1fr; }
      .pitch-slot { width: 80px; height: 100px; }
      .formation-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Scheunentor zum Olymp</h1>
      <div class="subtitle">Die ultimative Fußball-Ratings-App</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('ratings')">⭐ Bewertungen</button>
      <button class="tab-btn" onclick="switchTab('squad')">👥 Traumaufstellung</button>
      <button class="tab-btn" onclick="switchTab('hof')">🏆 Die Götter des Fußballs</button>
    </div>

    <!-- TAB 1: RATINGS -->
    <div id="ratings" class="tab-content active">
      <div class="form-group">
        <label for="playerName">Spielername</label>
        <input type="text" id="playerName" placeholder="z.B. Lionel Messi">
      </div>
      <div class="form-group">
        <label for="playerImage">Bild-URL</label>
        <input type="url" id="playerImage" placeholder="https://example.com/image.jpg">
      </div>
      <div class="form-group">
        <label for="playerRating">Rating (0-99)</label>
        <input type="number" id="playerRating" min="0" max="99" placeholder="z.B. 95">
      </div>
      <div class="form-group">
        <label for="playerPosition">Hauptposition</label>
        <select id="playerPosition">
          <option value="">-- Position wählen --</option>
          <option value="TW">TW (Torwart)</option>
          <option value="LV">LV (Linksverteidiger)</option>
          <option value="IV">IV (Innenverteidiger)</option>
          <option value="RV">RV (Rechtsverteidiger)</option>
          <option value="LM">LM (Linkes Mittelfeld)</option>
          <option value="ZM">ZM (Zentrales Mittelfeld)</option>
          <option value="RM">RM (Rechtes Mittelfeld)</option>
          <option value="ZDM">ZDM (Defensives Mittelfeld)</option>
          <option value="ZOM">ZOM (Offensives Mittelfeld)</option>
          <option value="LF">LF (Linksaußen)</option>
          <option value="RF">RF (Rechtsaußen)</option>
          <option value="MS">MS (Mittelstürmer)</option>
          <option value="ST">ST (Stürmer)</option>
          <option value="LS">LS (Linker Stürmer)</option>
          <option value="RS">RS (Rechter Stürmer)</option>
        </select>
      </div>
      <div class="alt-positions-container">
        <label>Alternative Positionen (optional)</label>
        <div class="alt-positions-grid" id="altPositionsGrid"></div>
      </div>
      <button class="btn" id="submitBtn" onclick="addPlayer()">Spieler hinzufügen</button>
      <button class="btn btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none; margin-left:10px;">Abbrechen</button>

      <div class="reset-container">
        <div class="reset-warning">⚠️ ACHTUNG: Diese Aktion löscht ALLE Daten unwiderruflich!</div>
        <button class="btn btn-danger" onclick="resetAllData()">🗑️ Alle Daten löschen (Reset)</button>
      </div>

      <div id="playersList" style="margin-top: 40px;"></div>
    </div>

    <!-- TAB 2: TRAUMAUFSTELLUNG -->
    <div id="squad" class="tab-content">
      <div class="formation-selector">
        <label>Formation wählen</label>
        <div class="formation-grid" id="formationGrid"></div>
      </div>

      <div class="squad-management">
        <h3 style="color: #D4AF37; margin-bottom: 15px;">Aufstellung speichern/laden</h3>
        <div class="squad-controls">
          <input type="text" id="squadName" placeholder="Aufstellungsname" style="flex: 1; min-width: 200px;">
          <button class="btn" onclick="saveSquad()">💾 Speichern</button>
          <button class="btn btn-secondary" onclick="clearSquad()">🗑️ Leeren</button>
        </div>
        <div class="squad-list" id="savedSquadsList"></div>
      </div>

      <div class="pitch" id="pitch"></div>

      <div class="bench-container">
        <button class="bench-toggle" onclick="toggleBench()">🪑 Ersatzbank (0/7)</button>
        <div class="bench-slots" id="benchSlots"></div>
      </div>
    </div>

    <!-- TAB 3: HALL OF FAME -->
    <div id="hof" class="tab-content">
      <div class="hof-header">
        <div class="hof-title">Die Götter des Fußballs</div>
        <div class="subtitle">Die Hall of Fame der besten Spieler</div>
      </div>

      <div class="hof-tabs">
        <button class="hof-tab-btn active" onclick="switchHofTab('ranking')">📊 Ranking</button>
        <button class="hof-tab-btn" onclick="switchHofTab('position')">⚽ Nach Position</button>
      </div>

      <div id="hof-ranking" class="hof-tab-content"></div>
      <div id="hof-position" class="hof-tab-content" style="display:none;">
        <div class="hof-tabs" style="margin-bottom: 20px;">
          <button class="hof-tab-btn active" onclick="filterByPositionCategory('all')">Alle</button>
          <button class="hof-tab-btn" onclick="filterByPositionCategory('GK')">Torhüter</button>
          <button class="hof-tab-btn" onclick="filterByPositionCategory('DEF')">Verteidiger</button>
          <button class="hof-tab-btn" onclick="filterByPositionCategory('MID')">Mittelfeld</button>
          <button class="hof-tab-btn" onclick="filterByPositionCategory('ATT')">Angriff</button>
        </div>
        <div id="hof-position-list"></div>
      </div>
    </div>
  </div>

  <script>
    let players = JSON.parse(localStorage.getItem('players')) || [];
    let editingIndex = null;
    let currentFormation = null;
    let squadPlayers = Array(11).fill(null);
    let benchPlayers = Array(7).fill(null);
    let savedSquads = JSON.parse(localStorage.getItem('savedSquads')) || [];

    const formations = {
      '4-3-3': [['ST'],['LF','ZOM','RF'],['LM','ZM','RM'],['LV','IV','IV','RV'],['TW']],
      '4-4-2': [['ST','ST'],['LM','ZM','ZM','RM'],['LV','IV','IV','RV'],['TW']],
      '4-2-3-1': [['ST'],['LF','ZOM','RF'],['ZDM','ZDM'],['LV','IV','IV','RV'],['TW']],
      '3-5-2': [['ST','ST'],['LM','ZDM','ZM','ZOM','RM'],['IV','IV','IV'],['TW']],
      '4-3-3 (Defensiv)': [['ST'],['LF','ZOM','RF'],['ZDM','ZM','ZM'],['LV','IV','IV','RV'],['TW']],
      '4-3-3 (Angriff)': [['ST'],['LF','ZOM','RF'],['ZM','ZM','ZOM'],['LV','IV','IV','RV'],['TW']],
      '4-2-3-1 (Breit)': [['ST'],['LM','ZOM','RM'],['ZDM','ZDM'],['LV','IV','IV','RV'],['TW']],
      '4-1-2-1-2': [['ST','ST'],['ZOM'],['ZM','ZM'],['ZDM'],['LV','IV','IV','RV'],['TW']],
      '3-4-3': [['LF','ST','RF'],['LM','ZM','ZM','RM'],['IV','IV','IV'],['TW']],
      '5-3-2': [['ST','ST'],['LM','ZM','RM'],['LV','IV','IV','IV','RV'],['TW']],
      '4-1-4-1': [['ST'],['LM','ZM','ZM','RM'],['ZDM'],['LV','IV','IV','RV'],['TW']],
      '4-4-1-1': [['ST'],['ZOM'],['LM','ZM','ZM','RM'],['LV','IV','IV','RV'],['TW']],
      '3-4-2-1': [['ST'],['ZOM','ZOM'],['LM','ZM','ZM','RM'],['IV','IV','IV'],['TW']],
      '4-3-2-1': [['ST'],['ZOM','ZOM'],['LM','ZM','RM'],['LV','IV','IV','RV'],['TW']],
      '5-4-1': [['ST'],['LM','ZM','ZM','RM'],['LV','IV','IV','IV','RV'],['TW']],
      '4-5-1': [['ST'],['LM','ZDM','ZM','ZOM','RM'],['LV','IV','IV','RV'],['TW']],
      '3-5-1-1': [['ST'],['ZOM'],['LM','ZDM','ZM','ZOM','RM'],['IV','IV','IV'],['TW']],
      '4-1-3-2': [['ST','ST'],['LM','ZM','RM'],['ZDM'],['LV','IV','IV','RV'],['TW']],
      '4-2-2-2': [['ST','ST'],['ZOM','ZOM'],['ZDM','ZDM'],['LV','IV','IV','RV'],['TW']],
      '3-4-1-2': [['ST','ST'],['ZOM'],['LM','ZM','ZM','RM'],['IV','IV','IV'],['TW']],
      '5-2-3': [['LF','ST','RF'],['ZM','ZM'],['LV','IV','IV','IV','RV'],['TW']]
    };

    const allPositions = ['TW','LV','IV','RV','LM','ZM','RM','ZDM','ZOM','LF','RF','MS','ST','LS','RS'];

    // Migration: alte Spieler ohne altPositions ergänzen
    (function migrateOldPlayers() {
      let changed = false;
      players = players.map(p => {
        if (!p.altPositions) {
          p.altPositions = [];
          changed = true;
        }
        return p;
      });
      if (changed) {
        localStorage.setItem('players', JSON.stringify(players));
      }
    })();

    function renderAltPositionsCheckboxes() {
      const grid = document.getElementById('altPositionsGrid');
      const mainPos = document.getElementById('playerPosition').value;
      grid.innerHTML = '';
      allPositions.filter(p => p !== mainPos).forEach(pos => {
        const div = document.createElement('div');
        div.className = 'alt-pos-checkbox';
        div.innerHTML = `
          <input type="checkbox" id="alt-${pos}" value="${pos}">
          <label for="alt-${pos}">${pos}</label>
        `;
        grid.appendChild(div);
      });
    }

    document.getElementById('playerPosition').addEventListener('change', renderAltPositionsCheckboxes);

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'ratings') renderPlayers();
      if (tab === 'squad') { renderFormations(); renderSavedSquads(); }
      if (tab === 'hof') renderHof();
    }

    function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const image = document.getElementById('playerImage').value.trim();
      const rating = parseInt(document.getElementById('playerRating').value);
      const position = document.getElementById('playerPosition').value;

      if (!name || !rating || !position || rating < 0 || rating > 99) {
        alert('Bitte alle Felder korrekt ausfüllen!');
        return;
      }

      const altPositions = Array.from(document.querySelectorAll('#altPositionsGrid input[type="checkbox"]:checked'))
        .map(cb => cb.value);

      const player = { name, image, rating, position, altPositions };

      if (editingIndex !== null) {
        players[editingIndex] = player;
        editingIndex = null;
        document.getElementById('submitBtn').textContent = 'Spieler hinzufügen';
        document.getElementById('cancelEditBtn').style.display = 'none';
      } else {
        players.push(player);
      }

      localStorage.setItem('players', JSON.stringify(players));
      clearForm();
      renderPlayers();
    }

    function clearForm() {
      document.getElementById('playerName').value = '';
      document.getElementById('playerImage').value = '';
      document.getElementById('playerRating').value = '';
      document.getElementById('playerPosition').value = '';
      renderAltPositionsCheckboxes();
    }

    function cancelEdit() {
      editingIndex = null;
      clearForm();
      document.getElementById('submitBtn').textContent = 'Spieler hinzufügen';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function editPlayer(index) {
      const player = players[index];
      document.getElementById('playerName').value = player.name;
      document.getElementById('playerImage').value = player.image || '';
      document.getElementById('playerRating').value = player.rating;
      document.getElementById('playerPosition').value = player.position;
      
      renderAltPositionsCheckboxes();
      
      (player.altPositions || []).forEach(pos => {
        const cb = document.getElementById('alt-' + pos);
        if (cb) cb.checked = true;
      });

      editingIndex = index;
      document.getElementById('submitBtn').textContent = 'Spieler aktualisieren';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      
      switchTab('ratings');
      document.getElementById('playerName').scrollIntoView({ behavior: 'smooth' });
    }

    function deletePlayer(index) {
      if (confirm('Spieler wirklich löschen?')) {
        players.splice(index, 1);
        localStorage.setItem('players', JSON.stringify(players));
        renderPlayers();
        renderHof();
      }
    }

    function getTierClass(rating) {
      if (rating >= 95) return 'tier-elite';
      if (rating >= 90) return 'tier-gold';
      if (rating >= 85) return 'tier-silver';
      if (rating >= 80) return 'tier-bronze';
      return 'tier-cl';
    }

    function getTierName(rating) {
      if (rating >= 95) return 'Elite (95-99)';
      if (rating >= 90) return 'Gold (90-94)';
      if (rating >= 85) return 'Silber (85-89)';
      if (rating >= 80) return 'Bronze (80-84)';
      return 'Champions League (0-79)';
    }

    function renderPlayers() {
      const container = document.getElementById('playersList');
      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#aaa; padding:40px;">Noch keine Spieler vorhanden.</p>';
        return;
      }

      const tiers = { elite: [], gold: [], silver: [], bronze: [], cl: [] };
      players.forEach((p, i) => {
        const tier = p.rating >= 95 ? 'elite' : p.rating >= 90 ? 'gold' : p.rating >= 85 ? 'silver' : p.rating >= 80 ? 'bronze' : 'cl';
        tiers[tier].push({ ...p, index: i });
      });

      let html = '';
      ['elite', 'gold', 'silver', 'bronze', 'cl'].forEach(tier => {
        if (tiers[tier].length === 0) return;
        const rating = tier === 'elite' ? 95 : tier === 'gold' ? 90 : tier === 'silver' ? 85 : tier === 'bronze' ? 80 : 0;
        html += `<div class="tier-section">
          <div class="tier-header ${getTierClass(rating)}">${getTierName(rating)}</div>
          <div class="players-grid">`;
        tiers[tier].forEach(p => {
          const allPos = [p.position, ...(p.altPositions || [])];
          const posHTML = allPos.map((pos, idx) => 
            `<span class="position-tag ${idx === 0 ? 'primary' : ''}">${pos}</span>`
          ).join('');
          html += `<div class="player-card">
            ${p.image ? `<img src="${p.image}" class="player-img" onerror="this.src='https://via.placeholder.com/250x200?text=Kein+Bild'">` : '<div class="player-img" style="background:#333;display:flex;align-items:center;justify-content:center;color:#666;">Kein Bild</div>'}
            <div class="player-name">${p.name}</div>
            <div class="player-rating" style="color:${p.rating >= 95 ? '#8B5CF6' : p.rating >= 90 ? '#D4AF37' : p.rating >= 85 ? '#C0C0C0' : p.rating >= 80 ? '#CD7F32' : '#003B7A'}">${p.rating}</div>
            <div class="player-positions">${posHTML}</div>
            <div class="action-buttons">
              <button class="btn btn-secondary" onclick="editPlayer(${p.index})">✏️ Bearbeiten</button>
              <button class="btn btn-danger" onclick="deletePlayer(${p.index})">🗑️ Löschen</button>
            </div>
          </div>`;
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    function renderFormations() {
      const grid = document.getElementById('formationGrid');
      grid.innerHTML = '';
      Object.keys(formations).forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'formation-btn' + (currentFormation === f ? ' active' : '');
        btn.textContent = f;
        btn.onclick = () => selectFormation(f);
        grid.appendChild(btn);
      });
    }

    function selectFormation(formation) {
      currentFormation = formation;
      renderFormations();
      renderPitch();
    }

    function renderPitch() {
      const pitch = document.getElementById('pitch');
      if (!currentFormation) {
        pitch.innerHTML = '<p style="text-align:center;color:#aaa;">Bitte wähle zuerst eine Formation.</p>';
        return;
      }

      const rows = formations[currentFormation];
      let html = '';
      let slotIndex = 0;

      rows.forEach((row, rowIdx) => {
        html += '<div class="pitch-row">';
        row.forEach(pos => {
          const player = squadPlayers[slotIndex];
          const filled = player ? ' filled' : '';
          html += `<div class="pitch-slot${filled}" onclick="selectSquadSlot(${slotIndex}, '${pos}')">`;
          if (player) {
            html += `
              ${player.image ? `<img src="${player.image}" onerror="this.src='https://via.placeholder.com/60?text=?'">` : '<div style="width:60px;height:60px;background:#666;border-radius:50%;"></div>'}
              <div class="player-name-small">${player.name.split(' ').pop()}</div>
              <div class="player-rating-small">${player.rating}</div>
            `;
          } else {
            html += `<div style="color:#D4AF37;font-weight:bold;">${pos}</div>`;
          }
          html += '</div>';
          slotIndex++;
        });
        html += '</div>';
      });

      pitch.innerHTML = html;
      renderBench();
    }

    function renderBench() {
      const container = document.getElementById('benchSlots');
      let html = '';
      for (let i = 0; i < 7; i++) {
        const player = benchPlayers[i];
        const filled = player ? ' filled' : '';
        html += `<div class="pitch-slot${filled}" onclick="selectBenchSlot(${i})">`;
        if (player) {
          html += `
            ${player.image ? `<img src="${player.image}" onerror="this.src='https://via.placeholder.com/60?text=?'">` : '<div style="width:60px;height:60px;background:#666;border-radius:50%;"></div>'}
            <div class="player-name-small">${player.name.split(' ').pop()}</div>
            <div class="player-rating-small">${player.rating}</div>
          `;
        } else {
          html += '<div style="color:#D4AF37;font-weight:bold;">BANK</div>';
        }
        html += '</div>';
      }
      container.innerHTML = html;
      updateBenchToggle();
    }

    function updateBenchToggle() {
      const count = benchPlayers.filter(p => p !== null).length;
      document.querySelector('.bench-toggle').textContent = `🪑 Ersatzbank (${count}/7)`;
    }

    function toggleBench() {
      document.getElementById('benchSlots').classList.toggle('open');
    }

    function selectSquadSlot(index, requiredPos) {
      if (squadPlayers[index]) {
        if (confirm('Spieler entfernen?')) {
          squadPlayers[index] = null;
          renderPitch();
        }
        return;
      }

      const usedIds = [...squadPlayers, ...benchPlayers].filter(p => p).map((p, i) => players.findIndex(pl => pl.name === p.name && pl.rating === p.rating));
      const available = players.filter((p, i) => {
        if (usedIds.includes(i)) return false;
        return p.position === requiredPos || (p.altPositions && p.altPositions.includes(requiredPos));
      });

      if (available.length === 0) {
        alert(`Keine verfügbaren Spieler für Position ${requiredPos}`);
        return;
      }

      showPlayerSelectionModal(available, (player) => {
        squadPlayers[index] = player;
        renderPitch();
      });
    }

    function selectBenchSlot(index) {
      if (benchPlayers[index]) {
        if (confirm('Spieler entfernen?')) {
          benchPlayers[index] = null;
          renderBench();
        }
        return;
      }

      const usedIds = [...squadPlayers, ...benchPlayers].filter(p => p).map((p, i) => players.findIndex(pl => pl.name === p.name && pl.rating === p.rating));
      const available = players.filter((p, i) => !usedIds.includes(i));

      if (available.length === 0) {
        alert('Keine verfügbaren Spieler mehr!');
        return;
      }

      showPlayerSelectionModal(available, (player) => {
        benchPlayers[index] = player;
        renderBench();
      });
    }

    function showPlayerSelectionModal(availablePlayers, callback) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
      
      const content = document.createElement('div');
      content.style.cssText = 'background:linear-gradient(135deg, #1a1410 0%, #0a0a0a 100%);padding:30px;border-radius:20px;max-width:800px;width:100%;max-height:80vh;overflow-y:auto;border:2px solid #D4AF37;';
      
      let html = '<h2 style="color:#D4AF37;margin-bottom:20px;">Spieler auswählen</h2><div class="players-grid">';
      availablePlayers.forEach(p => {
        const allPos = [p.position, ...(p.altPositions || [])];
        const posHTML = allPos.map((pos, idx) => 
          `<span class="position-tag ${idx === 0 ? 'primary' : ''}">${pos}</span>`
        ).join('');
        html += `<div class="player-card" style="cursor:pointer;" onclick="window.modalCallback(${players.indexOf(p)})">
          ${p.image ? `<img src="${p.image}" class="player-img" onerror="this.src='https://via.placeholder.com/250x200?text=Kein+Bild'">` : '<div class="player-img" style="background:#333;"></div>'}
          <div class="player-name">${p.name}</div>
          <div class="player-rating" style="color:${p.rating >= 95 ? '#8B5CF6' : p.rating >= 90 ? '#D4AF37' : p.rating >= 85 ? '#C0C0C0' : p.rating >= 80 ? '#CD7F32' : '#003B7A'}">${p.rating}</div>
          <div class="player-positions">${posHTML}</div>
        </div>`;
      });
      html += '</div><button class="btn btn-secondary" style="margin-top:20px;width:100%;" onclick="this.closest(\'.modal-wrapper\').remove()">❌ Abbrechen</button>';
      
      content.innerHTML = html;
      modal.appendChild(content);
      modal.className = 'modal-wrapper';
      document.body.appendChild(modal);

      window.modalCallback = (index) => {
        callback(players[index]);
        modal.remove();
      };
    }

    function clearSquad() {
      if (confirm('Aufstellung wirklich leeren?')) {
        squadPlayers = Array(11).fill(null);
        benchPlayers = Array(7).fill(null);
        renderPitch();
      }
    }

    function saveSquad() {
      const name = document.getElementById('squadName').value.trim();
      if (!name) {
        alert('Bitte Namen eingeben!');
        return;
      }
      if (!currentFormation) {
        alert('Bitte Formation wählen!');
        return;
      }

      const squad = {
        name,
        formation: currentFormation,
        players: squadPlayers,
        bench: benchPlayers
      };

      const existing = savedSquads.findIndex(s => s.name === name);
      if (existing >= 0) {
        if (confirm('Aufstellung existiert bereits. Überschreiben?')) {
          savedSquads[existing] = squad;
        } else {
          return;
        }
      } else {
        savedSquads.push(squad);
      }

      localStorage.setItem('savedSquads', JSON.stringify(savedSquads));
      document.getElementById('squadName').value = '';
      renderSavedSquads();
      alert('✅ Aufstellung gespeichert!');
    }

    function loadSquad(index) {
      const squad = savedSquads[index];
      currentFormation = squad.formation;
      squadPlayers = squad.players;
      benchPlayers = squad.bench;
      renderFormations();
      renderPitch();
      alert(`✅ Aufstellung "${squad.name}" geladen!`);
    }

    function deleteSquad(index) {
      if (confirm('Aufstellung wirklich löschen?')) {
        savedSquads.splice(index, 1);
        localStorage.setItem('savedSquads', JSON.stringify(savedSquads));
        renderSavedSquads();
      }
    }

    function renderSavedSquads() {
      const container = document.getElementById('savedSquadsList');
      if (savedSquads.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#aaa;padding:20px;">Keine gespeicherten Aufstellungen.</p>';
        return;
      }

      let html = '';
      savedSquads.forEach((s, i) => {
        html += `<div class="squad-item">
          <div>
            <div class="squad-item-name">${s.name}</div>
            <div style="font-size:0.85em;color:#aaa;">${s.formation}</div>
          </div>
          <div class="squad-item-buttons">
            <button class="btn btn-secondary" onclick="loadSquad(${i})">📂 Laden</button>
            <button class="btn btn-danger" onclick="deleteSquad(${i})">🗑️</button>
          </div>
        </div>`;
      });
      container.innerHTML = html;
    }

    function switchHofTab(tab) {
      document.querySelectorAll('.hof-tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('hof-ranking').style.display = tab === 'ranking' ? 'block' : 'none';
      document.getElementById('hof-position').style.display = tab === 'position' ? 'block' : 'none';
    }

    function renderHof() {
      renderHofRanking();
      filterByPositionCategory('all');
    }

    function renderHofRanking() {
      const container = document.getElementById('hof-ranking');
      const sorted = [...players].sort((a, b) => b.rating - a.rating);

      if (sorted.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#aaa;padding:40px;">Noch keine Spieler in der Hall of Fame.</p>';
        return;
      }

      const tiers = { elite: [], gold: [], silver: [], bronze: [], cl: [] };
      sorted.forEach((p, i) => {
        const tier = p.rating >= 95 ? 'elite' : p.rating >= 90 ? 'gold' : p.rating >= 85 ? 'silver' : p.rating >= 80 ? 'bronze' : 'cl';
        tiers[tier].push({ ...p, index: players.findIndex(pl => pl.name === p.name && pl.rating === p.rating) });
      });

      let html = '';
      ['elite', 'gold', 'silver', 'bronze', 'cl'].forEach(tier => {
        if (tiers[tier].length === 0) return;
        const rating = tier === 'elite' ? 95 : tier === 'gold' ? 90 : tier === 'silver' ? 85 : tier === 'bronze' ? 80 : 0;
        html += `<div class="tier-section">
          <div class="tier-header ${getTierClass(rating)}">${getTierName(rating)}</div>
          <div class="players-grid">`;
        tiers[tier].forEach(p => {
          const allPos = [p.position, ...(p.altPositions || [])];
          const posHTML = allPos.map((pos, idx) => 
            `<span class="position-tag ${idx === 0 ? 'primary' : ''}">${pos}</span>`
          ).join('');
          html += `<div class="player-card">
            ${p.image ? `<img src="${p.image}" class="player-img" onerror="this.src='https://via.placeholder.com/250x200?text=Kein+Bild'">` : '<div class="player-img" style="background:#333;"></div>'}
            <div class="player-name">${p.name}</div>
            <div class="player-rating" style="color:${p.rating >= 95 ? '#8B5CF6' : p.rating >= 90 ? '#D4AF37' : p.rating >= 85 ? '#C0C0C0' : p.rating >= 80 ? '#CD7F32' : '#003B7A'}">${p.rating}</div>
            <div class="player-positions">${posHTML}</div>
            <div class="action-buttons">
              <button class="btn btn-secondary" onclick="editPlayer(${p.index})">✏️ Bearbeiten</button>
              <button class="btn btn-danger" onclick="deletePlayer(${p.index})">🗑️ Löschen</button>
            </div>
          </div>`;
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    function filterByPositionCategory(category) {
      document.querySelectorAll('#hof-position .hof-tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const posMap = {
        'GK': ['TW'],
        'DEF': ['LV', 'IV', 'RV'],
        'MID': ['LM', 'ZM', 'RM', 'ZDM', 'ZOM'],
        'ATT': ['LF', 'RF', 'MS', 'ST', 'LS', 'RS']
      };

      let filtered = players;
      if (category !== 'all') {
        const positions = posMap[category];
        filtered = players.filter(p => positions.includes(p.position));
      }

      const sorted = [...filtered].sort((a, b) => b.rating - a.rating);
      const container = document.getElementById('hof-position-list');

      if (sorted.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#aaa;padding:40px;">Keine Spieler in dieser Kategorie.</p>';
        return;
      }

      const tiers = { elite: [], gold: [], silver: [], bronze: [], cl: [] };
      sorted.forEach((p, i) => {
        const tier = p.rating >= 95 ? 'elite' : p.rating >= 90 ? 'gold' : p.rating >= 85 ? 'silver' : p.rating >= 80 ? 'bronze' : 'cl';
        tiers[tier].push({ ...p, index: players.findIndex(pl => pl.name === p.name && pl.rating === p.rating) });
      });

      let html = '';
      ['elite', 'gold', 'silver', 'bronze', 'cl'].forEach(tier => {
        if (tiers[tier].length === 0) return;
        const rating = tier === 'elite' ? 95 : tier === 'gold' ? 90 : tier === 'silver' ? 85 : tier === 'bronze' ? 80 : 0;
        html += `<div class="tier-section">
          <div class="tier-header ${getTierClass(rating)}">${getTierName(rating)}</div>
          <div class="players-grid">`;
        tiers[tier].forEach(p => {
          const allPos = [p.position, ...(p.altPositions || [])];
          const posHTML = allPos.map((pos, idx) => 
            `<span class="position-tag ${idx === 0 ? 'primary' : ''}">${pos}</span>`
          ).join('');
          html += `<div class="player-card">
            ${p.image ? `<img src="${p.image}" class="player-img" onerror="this.src='https://via.placeholder.com/250x200?text=Kein+Bild'">` : '<div class="player-img" style="background:#333;"></div>'}
            <div class="player-name">${p.name}</div>
            <div class="player-rating" style="color:${p.rating >= 95 ? '#8B5CF6' : p.rating >= 90 ? '#D4AF37' : p.rating >= 85 ? '#C0C0C0' : p.rating >= 80 ? '#CD7F32' : '#003B7A'}">${p.rating}</div>
            <div class="player-positions">${posHTML}</div>
            <div class="action-buttons">
              <button class="btn btn-secondary" onclick="editPlayer(${p.index})">✏️ Bearbeiten</button>
              <button class="btn btn-danger" onclick="deletePlayer(${p.index})">🗑️ Löschen</button>
            </div>
          </div>`;
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    function resetAllData() {
      const confirm1 = confirm('⚠️ ACHTUNG: Alle Spieler, Aufstellungen und Daten werden UNWIDERRUFLICH gelöscht!\n\nFortfahren?');
      if (!confirm1) return;

      const confirm2 = confirm('🔴 LETZTE WARNUNG: Diese Aktion kann NICHT rückgängig gemacht werden!\n\nWirklich alle Daten löschen?');
      if (!confirm2) return;

      localStorage.removeItem('players');
      localStorage.removeItem('savedSquads');
      players = [];
      savedSquads = [];
      squadPlayers = Array(11).fill(null);
      benchPlayers = Array(7).fill(null);
      currentFormation = null;
      editingIndex = null;
      
      clearForm();
      renderPlayers();
      renderFormations();
      renderSavedSquads();
      renderHof();
      
      alert('✅ Alle Daten wurden gelöscht!');
    }

    // Initial render
    renderPlayers();
    renderAltPositionsCheckboxes();

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
